<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Page not found — The Nandor Project</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛞</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #f0ebe2;
      color: #160c04;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 32px;
    }
    .box {
      background: #fff;
      border: 1px solid #e4ddd4;
      border-left: 3px solid #c44e18;
      border-radius: 12px;
      padding: 34px 38px;
      max-width: 460px;
    }
    .label {
      font-size: 9px; font-weight: 700; letter-spacing: .16em;
      text-transform: uppercase; color: #c44e18; margin-bottom: 10px;
    }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 30px; font-weight: 400; letter-spacing: -.02em;
      line-height: 1.15; margin-bottom: 12px;
    }
    p { font-size: 13px; line-height: 1.7; color: #907060; }
    a {
      display: inline-block; margin-top: 20px;
      font-size: 12px; font-weight: 600; letter-spacing: .04em;
      color: #c44e18; text-decoration: none;
      border-bottom: 1px solid #f0cdb8; padding-bottom: 2px;
    }
    a:hover { border-bottom-color: #c44e18; }
  </style>
</head>
<body>
  <div class="box">
    <div class="label">Error 404</div>
    <h1>This road doesn't go anywhere.</h1>
    <p>The page you're looking for isn't here — it may have been moved, renamed, or never existed at all.</p>
    <a href="/">← Back to The Nandor Project</a>
  </div>
</body>
</html>
